<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR - Meditation Pavilion</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #css-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        :root {
            var(--safe-top): clamp(10px, 2vh, 20px);
            var(--safe-side): clamp(10px, 2vw, 20px);
        }

        #fullscreen-btn {
            position: absolute;
            /* เปลี่ยนจาก top เป็น bottom และเว้นระยะจากขอบล่าง 95px เพื่อไม่ให้ทับเครดิต */
            bottom: 95px;
            right: var(--safe-side);
            padding: clamp(8px, 1.5vh, 10px) clamp(10px, 2vw, 15px);
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid white;
            border-radius: 5px;
            cursor: pointer;
            z-index: 999;
            font-size: clamp(12px, 1.5vh, 14px);
            pointer-events: auto;
        }

        #fullscreen-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        #stand-btn {
            position: absolute;
            bottom: clamp(20px, 4vh, 40px);
            left: var(--safe-side);
            padding: 12px 30px;
            background-color: #d32f2f;
            color: white;
            border: 2px solid white;
            border-radius: 25px;
            cursor: pointer;
            z-index: 999;
            font-size: clamp(14px, 1.8vh, 16px);
            font-weight: bold;
            display: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: background 0.3s;
            pointer-events: auto;
        }

        #stand-btn:hover {
            background-color: #f44336;
        }

        #credits {
            position: absolute;
            bottom: 25px;
            right: var(--safe-side);
            color: rgba(255, 255, 255, 0.7);
            font-size: clamp(10px, 1.2vh, 12px);
            text-align: right;
            z-index: 999;
            pointer-events: auto;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            max-width: 50vw;
        }

        #credits a {
            color: #00ffcc;
            text-decoration: none;
            font-weight: bold;
        }

        #credits a:hover {
            text-decoration: underline;
            color: #ffffff;
        }

        @media (max-width: 768px) {
            #hud-container {
                top: 10px !important;
                left: 10px !important;
            }

            #stand-btn {
                bottom: 100px;
                padding: 10px 20px;
                font-size: 14px;
            }

            /* ดันปุ่มขยายเต็มจอในมือถือขึ้นมาอีกนิด ป้องกันการซ้อนทับ */
            #fullscreen-btn {
                bottom: 110px;
            }

            /* ปรับกล่องเครดิตให้แสดงผลบนมือถือได้ดีขึ้น */
            #credits {
                max-width: 90vw;
            }
        }
    </style>
</head>

<body>
    <!-- ========================================== -->
    <!-- 1. ซ่อนกล่องสถานะเดิม (เพื่อให้ระบบคลิกที่นั่งเดิมยังทำงานได้โดยไม่พัง) -->
    <!-- ========================================== -->
    <div id="user-info" style="display: none;">ชื่อผู้ใช้: กำลังโหลด...</div>
    <div id="schedule-status" style="display: none;">กำลังตรวจสอบเวลา...</div>
    <div id="seat-status" style="display: none;">สถานะ: คลิกเลือกเบาะ หรือคลิกจุดสีทองหน้าบอร์ด</div>

    <!-- ========================================== -->
    <!-- 2. กล่อง UI สเตตัสใหม่ และ ปฏิทิน/นาฬิกา -->
    <!-- ========================================== -->
    <div id="hud-container"
        style="position: absolute; top: 20px; left: 20px; z-index: 100; display: flex; flex-direction: column; gap: 10px; pointer-events: none;">

        <!-- บรรทัด 1: ชื่อผู้ใช้งาน (คงที่) -->
        <div id="user-profile"
            style="border: 1px solid #ffd700; border-radius: 4px; padding: 8px 12px; background: rgba(20, 10, 5, 0.85); color: #ffd700; font-family: 'Sarabun', sans-serif; font-weight: bold; width: fit-content; pointer-events: auto; font-size: 14px;">
            ผู้ใช้งาน: กำลังโหลด...
        </div>

        <!-- บรรทัด 2: ข้อมูลห้องและจำนวนคน (คงที่ แสดงตลอดเวลา) -->
        <div id="server-status"
            style="border: 1px solid #4CAF50; border-radius: 4px; padding: 8px 12px; background: rgba(20, 10, 5, 0.85); color: #4CAF50; font-family: 'Sarabun', sans-serif; font-weight: bold; width: fit-content; pointer-events: auto; font-size: 14px;">
            กำลังเชื่อมต่อเซิร์ฟเวอร์...
        </div>

        <!-- บรรทัด 3: ข้อมูลที่วนลูป (โหมด / สถานะ) -->
        <div id="rotating-status"
            style="border: 1px solid #00ffcc; border-radius: 4px; padding: 8px 12px; background: rgba(20, 10, 5, 0.85); color: #00ffcc; font-family: 'Sarabun', sans-serif; font-weight: bold; width: fit-content; transition: opacity 0.4s ease-in-out; pointer-events: auto; font-size: 14px;">
            กำลังโหลดข้อมูล...
        </div>

        <!-- กล่องนาฬิกาและปฏิทินจันทรคติไทย -->
        <div id="datetime-box"
            style="border: 1px solid #ff9800; border-radius: 4px; padding: 10px 15px; background: rgba(20, 10, 5, 0.85); font-family: 'Sarabun', sans-serif; width: fit-content; margin-top: 5px; pointer-events: auto;">
            <div id="time-display"
                style="font-size: 26px; font-weight: bold; color: #ffeb3b; text-align: center; margin-bottom: 5px; letter-spacing: 2px;">
                00:00:00
            </div>
            <div id="date-display" style="font-size: 15px; color: #ffffff; text-align: center;">
                วัน...
            </div>
            <div id="lunar-display" style="font-size: 15px; color: #ffb74d; text-align: center; margin-top: 2px;">
                ข้างขึ้น...
            </div>
            <div id="holy-day-display"
                style="font-size: 15px; color: #ff5252; font-weight: bold; text-align: center; margin-top: 5px; display: none;">
                🌸 วันพระ
            </div>
        </div>
    </div>

    <button id="fullscreen-btn">ขยายเต็มจอ</button>
    <button id="stand-btn">🚶 เดินกลับ</button>

    <div id="credits">
        พัฒนาโดย: วินัย ผันอากาศ<br>
        รับฟังความคิดเห็น: <a href="https://www.facebook.com/winayo1" target="_blank">facebook.com/winayo1</a>
    </div>

    <div id="css-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

        // ==========================================
        // ข้อมูลการตั้งค่า
        // ==========================================
        // นำเข้าไฟล์ตั้งค่า (ดึงวิดีโอ, ข้อความบอร์ด, และปฏิทินจันทรคติ)
        import { appConfig } from './config.js';

        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getDatabase, ref, get, update, onValue, onDisconnect, increment } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

        // ==========================================
        // ระบบ Firebase จัดการห้อง (Room Instancing)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDu_F3ydhj9Pn3-WexZZoIoLntTM7dFqQs",
            authDomain: "meditation-pavilion.firebaseapp.com",
            databaseURL: "https://meditation-pavilion-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "meditation-pavilion",
            storageBucket: "meditation-pavilion.firebasestorage.app",
            messagingSenderId: "564385718895",
            appId: "1:564385718895:web:43c63082b6150c6ac4e39a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const ROOM_CAPACITY = 30; // ตั้งค่าจำนวนคนสูงสุดต่อห้อง
        let myRoomId = null;

        // ตัวแปรสำหรับแสดงผล UI จำนวนคนแบบเรียลไทม์
        let globalUsersCount = 1;
        let roomUsersCount = 1;
        let currentRoomNum = "1";
        let localBotCount = 0; // เพิ่มตัวแปรเก็บจำนวนบอทในเครื่อง

        function updateServerStatusUI() {
            // นำยอดคนจริงจาก Firebase มาบวกกับจำนวนบอท AI
            const totalGlobal = globalUsersCount + localBotCount;
            const totalRoom = roomUsersCount + localBotCount;

            document.getElementById('server-status').innerText = `🌐 รวมทุกห้อง: ${totalGlobal} คน | 🏠 ห้องที่ ${currentRoomNum} (${totalRoom}/${ROOM_CAPACITY} คน)`;
        }

        async function joinMeditationRoom() {
            const roomsRef = ref(db, 'rooms');
            const snapshot = await get(roomsRef);
            let rooms = snapshot.val() || {};

            let targetRoom = null;
            let maxRoomIndex = 0;

            for (const [roomId, roomData] of Object.entries(rooms)) {
                const roomNum = parseInt(roomId.split('_')[1]);
                if (roomNum > maxRoomIndex) maxRoomIndex = roomNum;

                if (roomData.count < ROOM_CAPACITY) {
                    targetRoom = roomId;
                    break;
                }
            }

            if (!targetRoom) {
                targetRoom = `room_${maxRoomIndex + 1}`;
            }
            myRoomId = targetRoom;

            // ตรวจสอบห้อง และเรียกสร้างบอทเฉพาะห้องที่ 1 เท่านั้น
            if (myRoomId === 'room_1') {
                spawnAIBots();
            }

            const myRoomCountRef = ref(db, `rooms/${myRoomId}/count`);
            const globalCountRef = ref(db, `global_users`);

            onDisconnect(myRoomCountRef).set(increment(-1));
            onDisconnect(globalCountRef).set(increment(-1));

            update(ref(db), {
                [`rooms/${myRoomId}/count`]: increment(1),
                [`global_users`]: increment(1)
            });

            onValue(globalCountRef, (snap) => {
                globalUsersCount = snap.val() || 1;
                updateServerStatusUI();
            });

            onValue(myRoomCountRef, (snap) => {
                roomUsersCount = snap.val() || 1;
                currentRoomNum = myRoomId.split('_')[1];
                updateServerStatusUI();
            });
        }
        joinMeditationRoom();

        // ตั้งชื่อผู้ใช้งาน
        const randomNum = Math.floor(Math.random() * 900) + 100;
        const currentUserName = `กัลยาณมิตร${randomNum}`;
        document.getElementById('user-info').innerText = `ผู้ใช้งาน: ${currentUserName}`;
        document.getElementById('user-profile').innerText = `ผู้ใช้งาน: ${currentUserName}`;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a3b4c);

        const defaultCameraPos = new THREE.Vector3(0, 2.5, 6.0);
        const defaultTargetPos = new THREE.Vector3(0, 1, -2);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.copy(defaultCameraPos);

        const vrCameraRig = new THREE.Group();
        vrCameraRig.add(camera);
        scene.add(vrCameraRig);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        renderer.xr.addEventListener('sessionstart', () => {
            const currentX = camera.position.x;
            const currentZ = camera.position.z;
            vrCameraRig.position.set(currentX, 0, currentZ);

            const lookDirection = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            lookDirection.y = 0;
            lookDirection.normalize();

            vrCameraRig.rotation.y = Math.atan2(lookDirection.x, lookDirection.z) + Math.PI;
        });

        renderer.xr.addEventListener('sessionend', () => {
            vrCameraRig.position.set(0, 0, 0);
            vrCameraRig.rotation.set(0, 0, 0);
        });

        const cssRenderer = new CSS3DRenderer();
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('css-container').appendChild(cssRenderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xfff3e0, 0.6);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffcc80, 1.5, 15);
        pointLight.position.set(0, 4, -2);
        scene.add(pointLight);

        // --- ลานปฏิบัติธรรม ---
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const altarGroup = new THREE.Group();
        altarGroup.position.set(-3.2, 0, -4.5);
        scene.add(altarGroup);

        const tableHeight = 0.8;
        const table = new THREE.Mesh(
            new THREE.BoxGeometry(2.0, tableHeight, 1.0),
            new THREE.MeshStandardMaterial({ color: 0x4a2e18 })
        );
        table.position.set(0, tableHeight / 2, 0);
        altarGroup.add(table);

        const loader = new GLTFLoader();
        loader.load('bhuddha.glb', function (gltf) {
            const buddhaModel = gltf.scene;
            const box = new THREE.Box3().setFromObject(buddhaModel);
            const size = box.getSize(new THREE.Vector3());
            const scaleFactor = 1.1 / size.y;
            buddhaModel.scale.set(scaleFactor, scaleFactor, scaleFactor);
            buddhaModel.rotation.y = 0;
            const boxUpdated = new THREE.Box3().setFromObject(buddhaModel);
            const center = boxUpdated.getCenter(new THREE.Vector3());
            buddhaModel.position.set(-center.x, tableHeight - boxUpdated.min.y, -center.z);
            altarGroup.add(buddhaModel);
        });

        // --- จอทีวี YouTube ---
        const tvGroup = new THREE.Group();
        tvGroup.position.set(1.5, 2.9, -4.8);
        scene.add(tvGroup);

        const tvFrame = new THREE.Mesh(
            new THREE.BoxGeometry(7.2, 4.2, 0.2),
            new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 })
        );
        tvGroup.add(tvFrame);

        const canvas = document.createElement('canvas');
        canvas.width = 1280;
        canvas.height = 720;
        const ctx = canvas.getContext('2d');

        const bgGrad = ctx.createLinearGradient(0, 0, 0, 720);
        bgGrad.addColorStop(0, '#1a0b00');
        bgGrad.addColorStop(0.5, '#3b1c00');
        bgGrad.addColorStop(1, '#1a0b00');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 4;
        ctx.strokeRect(40, 40, 1200, 640);

        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 70px Sarabun, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('🎧 โหมดวิทยุสมาธิ (VR Audio)', canvas.width / 2, 160);

        ctx.beginPath();
        ctx.moveTo(350, 230);
        ctx.lineTo(930, 230);
        ctx.strokeStyle = '#ffeb3b';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '36px Sarabun, sans-serif';
        ctx.fillText('เพื่อให้ท่านได้รับฟังเสียงสวดมนต์ในขณะอยู่ภายในโลกเสมือนจริง', canvas.width / 2, 310);

        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 42px Sarabun, sans-serif';
        ctx.fillText('คำแนะนำขั้นตอนการใช้งาน:', canvas.width / 2, 400);

        ctx.fillStyle = '#ffffff';
        ctx.font = '34px Sarabun, sans-serif';
        ctx.fillText('1. ถอดแว่น หรือกดปุ่ม "EXIT VR" ด้านล่าง เพื่อออกไปที่หน้าจอปกติก่อน', canvas.width / 2, 470);
        ctx.fillText('2. กดปุ่ม ▶️ Play ที่จอวิดีโอ YouTube เพื่อให้เสียงสวดมนต์เริ่มทำงาน', canvas.width / 2, 530);
        ctx.fillText('3. กดปุ่ม "ENTER VR" เพื่อกลับเข้าสู่ลานปฏิบัติธรรมอีกครั้ง', canvas.width / 2, 590);

        const vrTextTexture = new THREE.CanvasTexture(canvas);
        vrTextTexture.colorSpace = THREE.SRGBColorSpace;
        const vrScreenGeometry = new THREE.PlaneGeometry(7.0, 3.9);
        const vrScreenMaterial = new THREE.MeshBasicMaterial({ map: vrTextTexture });
        const vrScreen = new THREE.Mesh(vrScreenGeometry, vrScreenMaterial);

        vrScreen.position.set(0, 0, 0.11);
        tvGroup.add(vrScreen);

        const div = document.createElement('div');
        div.style.width = '700px';
        div.style.height = '400px';
        div.style.backgroundColor = '#000';

        const standbyUrl = appConfig.youtube.standbyUrl;
        const morningUrl = appConfig.youtube.morningUrl;
        const eveningUrl = appConfig.youtube.eveningUrl;

        const now = new Date();
        const curMins = now.getHours() * 60 + now.getMinutes();
        let activeVideoUrl = standbyUrl;
        let modeText = "โหมด: สแตนด์บาย (ช่องวัดท่าซุง)";

        if (curMins >= appConfig.youtube.morningStart && curMins <= appConfig.youtube.morningEnd) {
            activeVideoUrl = morningUrl + "?autoplay=1";
            modeText = "โหมด: ทำวัตรเช้า (04:00 - 05:30)";
        } else if (curMins >= appConfig.youtube.eveningStart && curMins <= appConfig.youtube.eveningEnd) {
            activeVideoUrl = eveningUrl + "?autoplay=1";
            modeText = "โหมด: ทำวัตรเย็น (18:00 - 19:30)";
        }

        document.getElementById('schedule-status').innerText = modeText;
        div.innerHTML = `<iframe width="700" height="400" src="${activeVideoUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border-radius: 4px;"></iframe>`;

        const cssObject = new CSS3DObject(div);
        cssObject.position.set(0, 0, 0.12);
        cssObject.scale.set(0.01, 0.01, 0.01);
        tvGroup.add(cssObject);

        // --- สร้างบอร์ดฝั่งซ้าย ---
        const prGroup = new THREE.Group();
        prGroup.position.set(-7.5, 1.675, 0.0);
        prGroup.rotation.y = Math.PI / 2;
        scene.add(prGroup);

        const prFrame = new THREE.Mesh(
            new THREE.BoxGeometry(2.7, 3.45, 0.1),
            new THREE.MeshStandardMaterial({ color: 0x4a2b18, roughness: 1.0 })
        );
        prGroup.add(prFrame);

        const prCanvas = document.createElement('canvas');
        prCanvas.width = 500;
        prCanvas.height = 650;
        const prCtx = prCanvas.getContext('2d');

        const prWoodGrad = prCtx.createLinearGradient(0, 0, 0, 650);
        prWoodGrad.addColorStop(0, '#5c3a21');
        prWoodGrad.addColorStop(0.4, '#422815');
        prWoodGrad.addColorStop(0.8, '#5c3a21');
        prWoodGrad.addColorStop(1, '#2e1b0d');
        prCtx.fillStyle = prWoodGrad;
        prCtx.fillRect(0, 0, 500, 650);

        prCtx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        for (let i = 0; i < 500; i += 8) {
            if (Math.random() > 0.2) {
                prCtx.fillRect(i, 0, Math.random() * 3 + 1, 650);
            }
        }

        prCtx.fillStyle = '#ffd700';
        prCtx.font = 'bold 32px Sarabun, sans-serif';
        prCtx.textAlign = 'center';
        prCtx.fillText(appConfig.prBoard.title, 250, 60);

        prCtx.beginPath();
        prCtx.moveTo(100, 80);
        prCtx.lineTo(400, 80);
        prCtx.strokeStyle = '#ffd700';
        prCtx.lineWidth = 2;
        prCtx.stroke();

        prCtx.fillStyle = '#00ffcc';
        prCtx.font = 'bold 24px Sarabun, sans-serif';
        prCtx.fillText(appConfig.prBoard.scheduleTitle, 250, 135);

        prCtx.textAlign = 'left';
        prCtx.fillStyle = '#ffffff';
        prCtx.font = '22px Sarabun, sans-serif';
        appConfig.prBoard.scheduleLines.forEach((line, index) => {
            prCtx.fillText(line, 80, 180 + (index * 40));
        });

        prCtx.beginPath();
        prCtx.moveTo(150, 310);
        prCtx.lineTo(350, 310);
        prCtx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        prCtx.lineWidth = 1;
        prCtx.stroke();

        prCtx.textAlign = 'center';
        prCtx.fillStyle = '#ffeb3b';
        prCtx.font = 'bold 24px Sarabun, sans-serif';
        prCtx.fillText(appConfig.prBoard.contactTitle, 250, 370);

        prCtx.fillStyle = '#ffffff';
        prCtx.font = '18px Sarabun, sans-serif';
        appConfig.prBoard.contactLines.forEach((line, index) => {
            prCtx.fillText(line, 250, 420 + (index * 30));
        });

        prCtx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        if (prCtx.roundRect) {
            prCtx.beginPath();
            prCtx.roundRect(70, 520, 360, 90, 15);
            prCtx.fill();
            prCtx.strokeStyle = '#ffd700';
            prCtx.lineWidth = 2;
            prCtx.stroke();
        } else {
            prCtx.fillRect(70, 520, 360, 90);
        }

        prCtx.fillStyle = '#00ffcc';
        prCtx.font = 'bold 20px Sarabun, sans-serif';
        prCtx.fillText(appConfig.prBoard.contactBoxTitle, 250, 555);

        prCtx.fillStyle = '#ffffff';
        prCtx.font = 'bold 28px Sarabun, sans-serif';
        prCtx.fillText(appConfig.prBoard.contactPhone, 250, 595);

        const prTexture = new THREE.CanvasTexture(prCanvas);
        prTexture.colorSpace = THREE.SRGBColorSpace;
        const prPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(2.5, 3.25),
            new THREE.MeshBasicMaterial({ map: prTexture })
        );
        prPlane.position.set(0, 0, 0.06);
        prGroup.add(prPlane);

        const hotspotGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.05, 32);
        const hotspotMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0x886600 });
        const prHotspot = new THREE.Mesh(hotspotGeo, hotspotMat);
        prHotspot.position.set(-5.0, 0.025, 0.0);
        prHotspot.userData = {
            isHotspot: true, type: "PR",
            targetPos: new THREE.Vector3(-5.0, 1.5, 0.0),
            lookAtPos: new THREE.Vector3(-7.5, 1.675, 0.0)
        };
        scene.add(prHotspot);

        // --- สร้างบอร์ดฝั่งขวา ---
        const devGroup = new THREE.Group();
        devGroup.position.set(7.5, 1.675, 0.0);
        devGroup.rotation.y = -Math.PI / 2;
        scene.add(devGroup);

        const devFrame = new THREE.Mesh(
            new THREE.BoxGeometry(2.7, 3.45, 0.1),
            new THREE.MeshStandardMaterial({ color: 0x4a2b18, roughness: 1.0 })
        );
        devGroup.add(devFrame);

        const devCanvas = document.createElement('canvas');
        devCanvas.width = 500;
        devCanvas.height = 650;
        const devCtx = devCanvas.getContext('2d');

        const devWoodGrad = devCtx.createLinearGradient(0, 0, 0, 650);
        devWoodGrad.addColorStop(0, '#5c3a21');
        devWoodGrad.addColorStop(0.4, '#422815');
        devWoodGrad.addColorStop(0.8, '#5c3a21');
        devWoodGrad.addColorStop(1, '#2e1b0d');
        devCtx.fillStyle = devWoodGrad;
        devCtx.fillRect(0, 0, 500, 650);

        devCtx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        for (let i = 0; i < 500; i += 8) {
            if (Math.random() > 0.2) {
                devCtx.fillRect(i, 0, Math.random() * 3 + 1, 650);
            }
        }

        devCtx.fillStyle = '#ffd700';
        devCtx.font = 'bold 32px Sarabun, sans-serif';
        devCtx.textAlign = 'center';
        devCtx.fillText('🙏 ร่วมสร้างวิหารธรรมออนไลน์', 250, 60);

        devCtx.beginPath();
        devCtx.moveTo(40, 80);
        devCtx.lineTo(460, 80);
        devCtx.strokeStyle = '#ffd700';
        devCtx.lineWidth = 2;
        devCtx.stroke();

        devCtx.fillStyle = '#ffffff';
        devCtx.font = 'bold 22px Sarabun, sans-serif';
        devCtx.fillText('"ทุกการภาวนาที่เกิดขึ้น ณ พื้นที่แห่งนี้', 250, 130);
        devCtx.fillText('ท่านคือผู้มีส่วนร่วมในมหากุศล"', 250, 165);

        devCtx.fillStyle = '#cccccc';
        devCtx.font = '18px Sarabun, sans-serif';
        devCtx.fillText('หากผลงานนี้มีประโยชน์กับคุณ หรือมีไอเดียอยากเสนอแนะเพิ่มเติม', 250, 230);
        devCtx.fillText('สามารถทักมาพูดคุย เลี้ยงกาแฟ หรือร่วมสนับสนุนโปรเจกต์ได้เลย', 250, 260);
        devCtx.fillText('ครับ ยินดีรับฟังทุกความคิดเห็น!', 250, 290);

        devCtx.fillStyle = '#ffffff';
        if (devCtx.roundRect) {
            devCtx.beginPath();
            devCtx.roundRect(50, 360, 400, 240, 15);
            devCtx.fill();
            devCtx.strokeStyle = '#ffd700';
            devCtx.lineWidth = 4;
            devCtx.stroke();
        } else {
            devCtx.fillRect(50, 360, 400, 240);
        }

        devCtx.fillStyle = '#666666';
        devCtx.font = 'bold 24px Sarabun, sans-serif';
        devCtx.fillText('LINE ID / เบอร์โทร:', 250, 410);

        devCtx.fillStyle = '#4CAF50';
        devCtx.font = 'bold 36px Sarabun, sans-serif';
        devCtx.fillText('0926533228', 250, 460);

        devCtx.fillStyle = '#5ac346';
        if (devCtx.roundRect) {
            devCtx.beginPath();
            devCtx.roundRect(100, 500, 300, 60, 30);
            devCtx.fill();
        } else {
            devCtx.fillRect(100, 500, 300, 60);
        }

        devCtx.fillStyle = '#ffffff';
        devCtx.font = 'bold 22px Sarabun, sans-serif';
        devCtx.fillText('💬 ทักไลน์มาคุยกัน', 250, 538);

        const devTexture = new THREE.CanvasTexture(devCanvas);
        devTexture.colorSpace = THREE.SRGBColorSpace;
        const devPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(2.5, 3.25),
            new THREE.MeshBasicMaterial({ map: devTexture })
        );
        devPlane.position.set(0, 0, 0.06);
        devGroup.add(devPlane);

        const lineBtnGeo = new THREE.PlaneGeometry(1.5, 0.3);
        const lineBtnMat = new THREE.MeshBasicMaterial({
            color: 0x00ff00,
            transparent: true,
            opacity: 0
        });
        const lineHitbox = new THREE.Mesh(lineBtnGeo, lineBtnMat);
        lineHitbox.position.set(0, -1.025, 0.07);
        lineHitbox.userData = { isLineButton: true };
        devGroup.add(lineHitbox);

        const devHotspot = new THREE.Mesh(hotspotGeo, hotspotMat.clone());
        devHotspot.position.set(5.0, 0.025, 0.0);
        devHotspot.userData = {
            isHotspot: true, type: "DEV",
            targetPos: new THREE.Vector3(5.0, 1.5, 0.0),
            lookAtPos: new THREE.Vector3(7.5, 1.675, 0.0)
        };
        scene.add(devHotspot);

        // --- เบาะรองนั่งและบอท ---
        const cushionGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 32);
        const rows = 5, colsPerSide = 3, spacingX = 1.2, spacingZ = 1.1, aisleWidth = 1.0;
        const seatingGroup = new THREE.Group();
        seatingGroup.position.set(0, 0.05, -1.5);
        scene.add(seatingGroup);

        const cushionsList = [];
        let mySelectedCushion = null;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < (colsPerSide * 2); c++) {
                let xPos = (c < colsPerSide) ? (c - colsPerSide) * spacingX - (aisleWidth / 2) : (c - colsPerSide - 1) * spacingX + spacingX + (aisleWidth / 2);
                let zPos = r * spacingZ;
                const cushion = new THREE.Mesh(cushionGeometry, new THREE.MeshStandardMaterial({ color: 0x3b2219 }));
                cushion.position.set(xPos, 0, zPos);
                cushion.userData = { row: r + 1, col: c + 1, isOccupied: false, isMine: false, occupantName: "", isHotspot: false };
                seatingGroup.add(cushion);
                cushionsList.push(cushion);
            }
        }

        function createMeditatorAvatar() {
            const group = new THREE.Group();
            const auraMaterial = new THREE.MeshStandardMaterial({
                color: 0xffeab3, emissive: 0xd4af37, emissiveIntensity: 0.6,
                roughness: 0.4, metalness: 0.1
            });

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), auraMaterial);
            head.position.set(0, 0.60, 0); group.add(head);

            const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), auraMaterial);
            shoulder.scale.set(1.35, 0.65, 1.0); shoulder.position.set(0, 0.44, 0); group.add(shoulder);

            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.26, 0.25, 16), auraMaterial);
            body.position.set(0, 0.32, 0); group.add(body);

            const pelvis = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), auraMaterial);
            pelvis.scale.set(1.1, 0.6, 0.9); pelvis.position.set(0, 0.16, 0.02); group.add(pelvis);

            const legs = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.08, 16), auraMaterial);
            legs.scale.set(1.1, 1, 0.8); legs.position.set(0, 0.04, 0.05); group.add(legs);

            const armGeo = new THREE.CapsuleGeometry(0.045, 0.26, 4, 8);
            const leftArm = new THREE.Mesh(armGeo, auraMaterial);
            leftArm.position.set(-0.17, 0.28, 0.10); leftArm.rotation.set(-0.5, 0, 0.2); group.add(leftArm);

            const rightArm = new THREE.Mesh(armGeo, auraMaterial);
            rightArm.position.set(0.17, 0.28, 0.10); rightArm.rotation.set(-0.5, 0, -0.2); group.add(rightArm);

            group.rotation.y = Math.PI;
            return group;
        }

        // ฟังก์ชันสร้างบอท 3-5 ตัว (จะถูกเรียกใช้เฉพาะคนที่อยู่ room_1 เท่านั้น)
        function spawnAIBots() {
            const botCount = Math.floor(Math.random() * 3) + 3; // สุ่มเลข 3 ถึง 5

            localBotCount = botCount; // บันทึกจำนวนบอทลงในตัวแปรส่วนกลาง
            updateServerStatusUI(); // สั่งให้อัปเดต UI บนหน้าจอทันที

            const availableIndices = [...Array(cushionsList.length).keys()];

            for (let i = 0; i < botCount; i++) {
                if (availableIndices.length === 0) break;
                const cushionIdx = availableIndices.splice(Math.floor(Math.random() * availableIndices.length), 1)[0];
                const botCushion = cushionsList[cushionIdx];

                botCushion.userData.isOccupied = true;
                botCushion.userData.occupantName = `กัลยาณมิตร${Math.floor(Math.random() * 900 + 100)} (AI)`;
                botCushion.material.color.setHex(0x2a1610);

                const avatar = createMeditatorAvatar();
                avatar.position.set(botCushion.position.x, 0.05, botCushion.position.z);
                seatingGroup.add(avatar);
            }
        }

        const interactables = [...cushionsList, prHotspot, devHotspot, lineHitbox];

        // --- ระบบควบคุมและ Raycaster ---
        let isSeated = false;
        let isReading = false;
        let isTransitioning = false;
        const targetCamPos = new THREE.Vector3();
        const targetLookAt = new THREE.Vector3();

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = false;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.target.copy(defaultTargetPos);
        controls.rotateSpeed = -1.0;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.target.tagName !== 'CANVAS') return;
            if (isTransitioning) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(interactables);

            if (intersects.length > 0) {
                const clickedObj = intersects[0].object;

                if (clickedObj.userData.isLineButton) {
                    window.open('https://line.me/ti/p/~0926533228', '_blank');
                    if (renderer.xr.isPresenting) {
                        renderer.xr.getSession().end();
                    }
                    return;
                }

                if (isSeated || isReading) return;

                else if (clickedObj.userData.isHotspot) {
                    targetCamPos.copy(clickedObj.userData.targetPos);
                    targetLookAt.copy(clickedObj.userData.lookAtPos);

                    isReading = true;
                    isTransitioning = true;
                    controls.enabled = false;

                    const boardType = clickedObj.userData.type === "PR" ? "กระดานสะพานบุญ" : "บอร์ดสนับสนุนผู้พัฒนา";
                    document.getElementById('seat-status').innerText = `สถานะ: ยืนอ่าน (${boardType})`;

                    const standBtn = document.getElementById('stand-btn');
                    standBtn.innerText = "🚶 เดินกลับ";
                    standBtn.style.display = 'block';
                }
                else {
                    if (clickedObj.userData.isOccupied) {
                        alert(`ที่นั่งนี้มีผู้ใช้งานแล้ว (${clickedObj.userData.occupantName}) กรุณาเลือกที่นั่งอื่นครับ`);
                        return;
                    }

                    clickedObj.userData.isOccupied = true;
                    clickedObj.userData.isMine = true;
                    clickedObj.userData.occupantName = currentUserName;
                    clickedObj.material.color.setHex(0x00ffcc);
                    mySelectedCushion = clickedObj;

                    document.getElementById('seat-status').innerText = `สถานะ: นั่งสมาธิ แถว ${clickedObj.userData.row}, ตัวที่ ${clickedObj.userData.col}`;

                    const standBtn = document.getElementById('stand-btn');
                    standBtn.innerText = "🚶 ลุกจากที่นั่ง";
                    standBtn.style.display = 'block';

                    const cushionWorldPos = new THREE.Vector3();
                    clickedObj.getWorldPosition(cushionWorldPos);

                    targetCamPos.set(cushionWorldPos.x, 1.0, cushionWorldPos.z);
                    const tvPos = new THREE.Vector3(1.5, 2.9, -4.8);
                    const dir = tvPos.clone().sub(targetCamPos).normalize();
                    targetLookAt.copy(targetCamPos).add(dir.multiplyScalar(0.01));

                    isSeated = true;
                    isTransitioning = true;
                    controls.enabled = false;
                }
            }
        });

        document.getElementById('stand-btn').addEventListener('click', () => {
            if (mySelectedCushion) {
                mySelectedCushion.userData.isMine = false;
                mySelectedCushion.userData.isOccupied = false;
                mySelectedCushion.userData.occupantName = "";
                mySelectedCushion.material.color.setHex(0x3b2219);
                mySelectedCushion = null;
            }

            document.getElementById('seat-status').innerText = "สถานะ: คลิกเลือกเบาะ หรือคลิกจุดสีทองหน้าบอร์ด";
            document.getElementById('stand-btn').style.display = 'none';

            isSeated = false;
            isReading = false;
            isTransitioning = true;
            controls.enabled = false;

            targetCamPos.copy(defaultCameraPos);
            targetLookAt.copy(defaultTargetPos);
        });

        // =========================================================
        // โค้ดระบบ UI วนลูปบรรทัดที่ 3
        // =========================================================
        const rotatingEl = document.getElementById('rotating-status');
        // เอาเลขห้องและจำนวนคนออกจากการวนลูป ให้เหลือแค่ตารางเวลาและสถานะที่นั่ง
        const hiddenEls = ['schedule-status', 'seat-status'];
        const colors = ['#ffd700', '#00ffcc'];
        let currentStatusIndex = 0;

        setInterval(() => {
            rotatingEl.style.opacity = 0;
            setTimeout(() => {
                const sourceEl = document.getElementById(hiddenEls[currentStatusIndex]);
                if (sourceEl) {
                    rotatingEl.innerText = sourceEl.innerText;
                    rotatingEl.style.color = colors[currentStatusIndex];
                    rotatingEl.style.borderColor = colors[currentStatusIndex];
                }
                rotatingEl.style.opacity = 1;
                currentStatusIndex = (currentStatusIndex + 1) % hiddenEls.length;
            }, 400);
        }, 3500);

        // =========================================================
        // โค้ดระบบนาฬิกาและปฏิทินจันทรคติไทย
        // =========================================================
        function updateDateTime() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('th-TH', { hour12: false });
            document.getElementById('time-display').innerText = timeStr;

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('th-TH', options);
            document.getElementById('date-display').innerText = dateStr;

            // ดึงฐานข้อมูลวันเริ่มต้นเดือนทางจันทรคติมาจาก config.js
            const realThaiCalendar = appConfig.thaiCalendar;

            // ค้นหาเดือนปัจจุบันจากฐานข้อมูล
            let currentCycle = realThaiCalendar[0];
            for (let i = 0; i < realThaiCalendar.length; i++) {
                const cycleDate = new Date(realThaiCalendar[i].d);
                cycleDate.setHours(0, 0, 0, 0);
                if (now >= cycleDate) {
                    currentCycle = realThaiCalendar[i];
                } else {
                    break;
                }
            }

            const cycleStartDate = new Date(currentCycle.d);
            cycleStartDate.setHours(0, 0, 0, 0);
            
            // นับจำนวนวันที่ผ่านมาจากวันขึ้น 1 ค่ำ
            const diffTime = Math.abs(now - cycleStartDate);
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;

            let phase = "";
            let day = diffDays;
            let isWaxing = true;
            let isHolyDay = false;

            if (day <= 15) {
                // ช่วงข้างขึ้น
                phase = `ขึ้น ${day} ค่ำ`;
                isWaxing = true;
                if (day === 8 || day === 15) isHolyDay = true;
            } else {
                // ช่วงข้างแรม
                day = day - 15;
                phase = `แรม ${day} ค่ำ`;
                isWaxing = false;
                
                // เช็กวันพระข้างแรม (แรม 8 ค่ำ และ แรม 14/15 ค่ำ ตามเดือนคู่-คี่)
                if (day === 8 || day === (currentCycle.days - 15)) isHolyDay = true;
            }

            let currentLunarMonth = currentCycle.m;
            let monthName = currentLunarMonth.toString();
            if (currentLunarMonth === 1) monthName = "อ้าย (๑)";
            if (currentLunarMonth === 2) monthName = "ยี่ (๒)";

            document.getElementById('lunar-display').innerText = `ตรงกับ: ${phase} เดือน ${monthName}`;

            // ตรวจสอบวันสำคัญทางพุทธศาสนา
            let importantDay = "";
            if (isWaxing && day === 15) {
                if (currentLunarMonth === 3) importantDay = "วันมาฆบูชา";
                else if (currentLunarMonth === 6) importantDay = "วันวิสาขบูชา";
                else if (currentLunarMonth === 8) importantDay = "วันอาสาฬหบูชา";
                else if (currentLunarMonth === 11) importantDay = "วันออกพรรษา";
            }
            else if (!isWaxing && day === 1) {
                if (currentLunarMonth === 8) importantDay = "วันเข้าพรรษา";
            }

            // แสดงผลป้ายแจ้งเตือน
            const holyDayEl = document.getElementById('holy-day-display');
            if (importantDay !== "") {
                holyDayEl.innerText = `🌟 ${importantDay}`;
                holyDayEl.style.display = 'block';
            } else if (isHolyDay) {
                holyDayEl.innerText = "🌸 วันธรรมสวนะ (วันพระ)";
                holyDayEl.style.display = 'block';
            } else {
                holyDayEl.style.display = 'none';
            }
        }

        setInterval(updateDateTime, 1000);
        updateDateTime();

        function animate() {
            if (isTransitioning) {
                camera.position.lerp(targetCamPos, 0.15);
                controls.target.lerp(targetLookAt, 0.15);

                if (camera.position.distanceTo(targetCamPos) < 0.05) {
                    isTransitioning = false;
                    camera.position.copy(targetCamPos);
                    controls.target.copy(targetLookAt);
                    controls.enabled = true;

                    if (isSeated || isReading) {
                        controls.enableZoom = false;
                        controls.enablePan = false;
                        controls.rotateSpeed = -0.7;

                        controls.minPolarAngle = Math.PI / 2 - 0.4;
                        controls.maxPolarAngle = Math.PI / 2 + 0.3;

                        const angle = Math.atan2(targetCamPos.x - targetLookAt.x, targetCamPos.z - targetLookAt.z);
                        const range = (110 * Math.PI) / 180;
                        controls.minAzimuthAngle = angle - range;
                        controls.maxAzimuthAngle = angle + range;
                    } else {
                        controls.enableZoom = true;
                        controls.enablePan = true;
                        controls.rotateSpeed = -1.0;
                        controls.minPolarAngle = 0;
                        controls.maxPolarAngle = Math.PI / 2 + 0.1;
                        controls.minAzimuthAngle = -Infinity;
                        controls.maxAzimuthAngle = Infinity;
                    }
                }
            } else if (controls.enabled) {
                controls.update();
            }

            renderer.render(scene, camera);
            cssRenderer.render(scene, camera);
        }
        renderer.setAnimationLoop(animate);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        const fsButton = document.getElementById('fullscreen-btn');
        fsButton.addEventListener('click', () => {
            if (!document.fullscreenElement) { document.body.requestFullscreen(); fsButton.innerText = "ย่อหน้าจอ"; }
            else { document.exitFullscreen(); fsButton.innerText = "ขยายเต็มจอ"; }
        });
    </script>
