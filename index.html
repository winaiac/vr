<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR - Meditation Pavilion</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
            /* ป้องกันการลากคลุมข้อความบน UI โดยไม่ตั้งใจ */
            user-select: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #css-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* --- สไตล์สำหรับป้ายบอร์ด 3D --- */
        .board-container {
            width: 500px;
            /* ใช้ min-height แทน height แบบตายตัว เพื่อให้กล่องขยายตามเนื้อหาได้ */
            min-height: 650px;
            background: rgba(20, 10, 5, 0.85);
            border: 4px solid #b8860b;
            border-radius: 10px;
            color: #fff;
            padding: 30px;
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
            box-shadow: 0 0 20px rgba(218, 165, 32, 0.4);
            pointer-events: auto;
        }

        .board-title {
            color: #ffd700;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 10px;
            text-align: center;
        }

        .board-text {
            font-size: 20px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .highlight-text {
            color: #00ffcc;
            font-weight: bold;
        }

        .bank-info {
            background: #ffffff;
            color: #000;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 22px;
            margin-top: 15px;
            border: 2px solid #ffd700;
        }

        /* --- UI แบบ Responsive --- */
        :root {
            /* กำหนดระยะขอบปลอดภัย */
            --safe-top: clamp(10px, 2vh, 20px);
            --safe-side: clamp(10px, 2vw, 20px);
        }

        #fullscreen-btn {
            position: absolute;
            top: var(--safe-top);
            right: var(--safe-side);
            padding: clamp(8px, 1.5vh, 10px) clamp(10px, 2vw, 15px);
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid white;
            border-radius: 5px;
            cursor: pointer;
            z-index: 999;
            font-size: clamp(12px, 1.5vh, 14px);
            pointer-events: auto;
        }

        #fullscreen-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        #stand-btn {
            position: absolute;
            /* ย้ายปุ่มมาไว้มุมซ้ายล่าง */
            bottom: clamp(20px, 4vh, 40px);
            left: var(--safe-side);

            /* ลบคำสั่ง left: 50% และ transform: translateX(-50%) ออก เพื่อไม่ให้อยู่ตรงกลาง */

            padding: 12px 30px;
            background-color: #d32f2f;
            color: white;
            border: 2px solid white;
            border-radius: 25px;
            cursor: pointer;
            z-index: 999;
            font-size: clamp(14px, 1.8vh, 16px);
            font-weight: bold;
            display: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: background 0.3s;
            pointer-events: auto;
        }

        #stand-btn:hover {
            background-color: #f44336;
        }

        .ui-box {
            position: absolute;
            left: var(--safe-side);
            padding: 8px 12px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #ffd700;
            border: 1px solid #ffd700;
            border-radius: 5px;
            z-index: 999;
            font-size: clamp(11px, 1.5vh, 13px);
            max-width: 60vw;
            /* ป้องกันกล่องข้อความยาวทะลุจอ */
            word-wrap: break-word;
        }

        /* ใช้ calc จัดระยะห่างแบบยืดหยุ่น */
        #user-info {
            top: var(--safe-top);
        }

        #online-users {
            top: calc(var(--safe-top) + 40px);
            color: #ff9900;
            border-color: #ff9900;
            font-weight: bold;
        }

        #schedule-status {
            top: calc(var(--safe-top) + 80px);
        }

        #seat-status {
            top: calc(var(--safe-top) + 120px);
            color: #00ffcc;
            border-color: #00ffcc;
        }

        #credits {
            position: absolute;
            /* ดันขึ้นมาหลบปุ่ม VR เช่นกัน */
            bottom: 25px;
            right: var(--safe-side);
            color: rgba(255, 255, 255, 0.7);
            font-size: clamp(10px, 1.2vh, 12px);
            text-align: right;
            z-index: 999;
            pointer-events: auto;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 8px;
            max-width: 50vw;
        }

        #credits a {
            color: #00ffcc;
            text-decoration: none;
            font-weight: bold;
        }

        #credits a:hover {
            text-decoration: underline;
            color: #ffffff;
        }

        /* --- Media Query สำหรับมือถือแนวตั้ง (Portrait) --- */
        @media (max-width: 768px) {
            #user-info {
                top: 10px;
            }

            #online-users {
                top: 45px;
            }

            #schedule-status {
                top: 80px;
            }

            #seat-status {
                top: 115px;
            }

            #stand-btn {
                bottom: 100px;
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div id="user-info" class="ui-box">ชื่อผู้ใช้: กำลังโหลด...</div>
    <div id="online-users" class="ui-box">ผู้เข้าร่วมขณะนี้: กำลังนับ...</div>
    <div id="schedule-status" class="ui-box">กำลังตรวจสอบเวลา...</div>
    <div id="seat-status" class="ui-box">สถานะ: คลิกเลือกเบาะเพื่อจอง หรือคลิกจุดสีทองเพื่อยืนอ่านป้าย</div>

    <button id="fullscreen-btn">ขยายเต็มจอ</button>
    <button id="stand-btn">🚶 เดินกลับ</button>

    <div id="credits">
        พัฒนาโดย: วินัย ผันอากาศ<br>
        รับฟังความคิดเห็น: <a href="https://www.facebook.com/winayo1" target="_blank">facebook.com/winayo1</a>
    </div>

    <div id="css-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

        const randomNum = Math.floor(Math.random() * 900) + 100;
        const currentUserName = `กัลยาณมิตร${randomNum}`;
        document.getElementById('user-info').innerText = `ผู้ใช้งาน: ${currentUserName}`;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a3b4c);

        const defaultCameraPos = new THREE.Vector3(0, 2.5, 6.0);
        const defaultTargetPos = new THREE.Vector3(0, 1, -2);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.copy(defaultCameraPos);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);
        document.body.appendChild(VRButton.createButton(renderer));

        const cssRenderer = new CSS3DRenderer();
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('css-container').appendChild(cssRenderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xfff3e0, 0.6);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffcc80, 1.5, 15);
        pointLight.position.set(0, 4, -2);
        scene.add(pointLight);

        // --- ลานปฏิบัติธรรม ---
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 16), floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // --- โต๊ะหมู่บูชาและพระพุทธรูป ---
        const altarGroup = new THREE.Group();
        altarGroup.position.set(-3.2, 0, -4.5);
        scene.add(altarGroup);

        const tableHeight = 0.8;
        const table = new THREE.Mesh(
            new THREE.BoxGeometry(2.0, tableHeight, 1.0),
            new THREE.MeshStandardMaterial({ color: 0x4a2e18 })
        );
        table.position.set(0, tableHeight / 2, 0);
        altarGroup.add(table);

        const loader = new GLTFLoader();
        loader.load('bhuddha.glb', function (gltf) {
            const buddhaModel = gltf.scene;
            const box = new THREE.Box3().setFromObject(buddhaModel);
            const size = box.getSize(new THREE.Vector3());
            const scaleFactor = 1.1 / size.y;
            buddhaModel.scale.set(scaleFactor, scaleFactor, scaleFactor);
            buddhaModel.rotation.y = 0;
            const boxUpdated = new THREE.Box3().setFromObject(buddhaModel);
            const center = boxUpdated.getCenter(new THREE.Vector3());
            buddhaModel.position.set(-center.x, tableHeight - boxUpdated.min.y, -center.z);
            altarGroup.add(buddhaModel);
        });

        // =========================================================
        // --- จอทีวี YouTube และข้อความแทนที่สำหรับโหมด VR ---
        // =========================================================
        const tvGroup = new THREE.Group();
        tvGroup.position.set(1.5, 2.9, -4.8);
        scene.add(tvGroup);

        // 1. สร้างกรอบทีวี
        const tvFrame = new THREE.Mesh(
            new THREE.BoxGeometry(7.2, 4.2, 0.2),
            new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.2 })
        );
        tvGroup.add(tvFrame);

        // 2. สร้าง Canvas วาดข้อความแจ้งเตือนสำหรับโหมด VR (แปลงเป็น 3D Texture)
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        // พื้นหลังสีดำ
        ctx.fillStyle = '#0a0a0a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // ข้อความสีทองและขาว
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 50px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('ขออภัยในความไม่สะดวก', canvas.width / 2, canvas.height / 2 - 40);

        ctx.fillStyle = '#ffffff';
        ctx.font = '36px sans-serif';
        ctx.fillText('กำลังพัฒนาระบบมัลติมีเดียให้รองรับระบบ VR โลกเสมือนจริง', canvas.width / 2, canvas.height / 2 + 40);

        // นำ Canvas มาแปะบนแผ่น Plane 3D
        const vrTextTexture = new THREE.CanvasTexture(canvas);
        const vrScreenGeometry = new THREE.PlaneGeometry(7.0, 3.9);
        const vrScreenMaterial = new THREE.MeshBasicMaterial({ map: vrTextTexture });
        const vrScreen = new THREE.Mesh(vrScreenGeometry, vrScreenMaterial);

        // ขยับป้ายแจ้งเตือนออกมาด้านหน้ากรอบทีวีเล็กน้อย (Z = 0.11)
        vrScreen.position.set(0, 0, 0.11);
        tvGroup.add(vrScreen);

        // 3. ส่วนของ iframe YouTube เดิม (CSS3D)
        const div = document.createElement('div');
        div.style.width = '700px';
        div.style.height = '400px';
        div.style.backgroundColor = '#000';

        const standbyUrl = "https://www.youtube.com/embed/ST6FSkpYrGs";
        const morningUrl = "https://www.youtube.com/embed/OnwLu4x0WOA";
        const eveningUrl = "https://www.youtube.com/embed/pPZ20jq8UaU";

        const now = new Date();
        const curMins = now.getHours() * 60 + now.getMinutes();
        let activeVideoUrl = standbyUrl;
        let modeText = "โหมด: สแตนด์บาย (ช่องวัดท่าซุง)";

        if (curMins >= 240 && curMins <= 330) {
            activeVideoUrl = morningUrl + "?autoplay=1";
            modeText = "โหมด: ทำวัตรเช้า (04:00 - 05:30)";
        } else if (curMins >= 1080 && curMins <= 1170) {
            activeVideoUrl = eveningUrl + "?autoplay=1";
            modeText = "โหมด: ทำวัตรเย็น (18:00 - 19:30)";
        }

        document.getElementById('schedule-status').innerText = modeText;
        div.innerHTML = `<iframe width="700" height="400" src="${activeVideoUrl}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border-radius: 4px;"></iframe>`;

        const cssObject = new CSS3DObject(div);
        // ขยับ iframe ให้อยู่หน้าแผ่นข้อความ VR นิดหน่อย (Z = 0.12) เพื่อใช้บังข้อความไว้ในโหมดปกติ
        cssObject.position.set(0, 0, 0.12);
        cssObject.scale.set(0.01, 0.01, 0.01);
        tvGroup.add(cssObject);
        // =========================================================

        // =========================================================
        // สร้างบอร์ด 3D (Texture Canvas) - ฝั่งซ้าย (ประชาสัมพันธ์)
        // =========================================================
        const prGroup = new THREE.Group();
        prGroup.position.set(-7.5, 1.675, 0.0);
        prGroup.rotation.y = Math.PI / 2;
        scene.add(prGroup);

        const prFrame = new THREE.Mesh(
            new THREE.BoxGeometry(2.6, 3.35, 0.1),
            new THREE.MeshStandardMaterial({ color: 0x3b2219, roughness: 0.8 })
        );
        prGroup.add(prFrame);

        // วาด Canvas ฝั่งซ้าย
        const prCanvas = document.createElement('canvas');
        prCanvas.width = 500;
        prCanvas.height = 650;
        const prCtx = prCanvas.getContext('2d');

        prCtx.fillStyle = '#140a05';
        prCtx.fillRect(0, 0, 500, 650);

        prCtx.fillStyle = '#ffd700';
        prCtx.font = 'bold 32px Sarabun, sans-serif';
        prCtx.textAlign = 'center';
        prCtx.fillText('📢 กระดานสะพานบุญ', 250, 60);

        prCtx.beginPath();
        prCtx.moveTo(100, 80);
        prCtx.lineTo(400, 80);
        prCtx.strokeStyle = '#ffd700';
        prCtx.lineWidth = 2;
        prCtx.stroke();

        prCtx.fillStyle = '#ffeb3b';
        prCtx.font = '20px Sarabun, sans-serif';
        prCtx.fillText('ขอเชิญชวนกัลยาณมิตรทุกท่าน ร่วมสมทบทุน', 250, 120);
        prCtx.fillText('ในโครงการบุญต่างๆ เพื่อสืบทอดพระพุทธศาสนา', 250, 150);

        prCtx.textAlign = 'left';
        prCtx.fillStyle = '#00ffcc';
        prCtx.font = 'bold 22px Sarabun, sans-serif';
        prCtx.fillText('• กองทุนภิกษุอาพาธ', 50, 230);
        prCtx.fillStyle = '#ffffff';
        prCtx.font = '20px Sarabun, sans-serif';
        prCtx.fillText('มูลนิธิโรงพยาบาลสงฆ์ (XXX-X-XXXXX-X)', 70, 260);

        prCtx.fillStyle = '#00ffcc';
        prCtx.font = 'bold 22px Sarabun, sans-serif';
        prCtx.fillText('• ร่วมสร้างอุโบสถ', 50, 330);
        prCtx.fillStyle = '#ffffff';
        prCtx.font = '20px Sarabun, sans-serif';
        prCtx.fillText('วัดป่า... (XXX-X-XXXXX-X)', 70, 360);

        prCtx.fillStyle = '#00ffcc';
        prCtx.font = 'bold 22px Sarabun, sans-serif';
        prCtx.fillText('• กองทุนคิลานเภสัช', 50, 430);
        prCtx.fillStyle = '#ffffff';
        prCtx.font = '20px Sarabun, sans-serif';
        prCtx.fillText('วัดท่าซุง (XXX-X-XXXXX-X)', 70, 460);

        const prTexture = new THREE.CanvasTexture(prCanvas);
        prTexture.colorSpace = THREE.SRGBColorSpace;
        const prPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(2.5, 3.25),
            new THREE.MeshBasicMaterial({ map: prTexture })
        );
        prPlane.position.set(0, 0, 0.06);
        prGroup.add(prPlane);

        // จุดยืนอ่านบอร์ดซ้าย
        const hotspotGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.05, 32);
        const hotspotMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0x886600 });
        const prHotspot = new THREE.Mesh(hotspotGeo, hotspotMat);
        prHotspot.position.set(-5.0, 0.025, 0.0);
        prHotspot.userData = {
            isHotspot: true, type: "PR",
            targetPos: new THREE.Vector3(-5.0, 1.5, 0.0),
            lookAtPos: new THREE.Vector3(-7.5, 1.675, 0.0)
        };
        scene.add(prHotspot);

        // =========================================================
        // สร้างบอร์ด 3D (Texture Canvas) - ฝั่งขวา (นักพัฒนา)
        // =========================================================
        const devGroup = new THREE.Group();
        devGroup.position.set(7.5, 1.675, 0.0);
        devGroup.rotation.y = -Math.PI / 2;
        scene.add(devGroup);

        const devFrame = new THREE.Mesh(
            new THREE.BoxGeometry(2.6, 3.35, 0.1),
            new THREE.MeshStandardMaterial({ color: 0x3b2219, roughness: 0.8 })
        );
        devGroup.add(devFrame);

        // วาด Canvas ฝั่งขวา (อัปเดตเป็น LINE ID และปุ่มสีเขียว)
        const devCanvas = document.createElement('canvas');
        devCanvas.width = 500;
        devCanvas.height = 650;
        const devCtx = devCanvas.getContext('2d');

        devCtx.fillStyle = '#140a05';
        devCtx.fillRect(0, 0, 500, 650);

        devCtx.fillStyle = '#ffd700';
        devCtx.font = 'bold 32px Sarabun, sans-serif';
        devCtx.textAlign = 'center';
        devCtx.fillText('🙏 ร่วมสร้างวิหารธรรมออนไลน์', 250, 60);

        devCtx.beginPath();
        devCtx.moveTo(40, 80);
        devCtx.lineTo(460, 80);
        devCtx.strokeStyle = '#ffd700';
        devCtx.lineWidth = 2;
        devCtx.stroke();

        devCtx.fillStyle = '#ffffff';
        devCtx.font = 'bold 22px Sarabun, sans-serif';
        devCtx.fillText('"ทุกการภาวนาที่เกิดขึ้น ณ พื้นที่แห่งนี้', 250, 130);
        devCtx.fillText('ท่านคือผู้มีส่วนร่วมในมหากุศล"', 250, 165);

        devCtx.fillStyle = '#cccccc';
        devCtx.font = '18px Sarabun, sans-serif';
        devCtx.fillText('หากผลงานนี้มีประโยชน์กับคุณ หรือมีไอเดียอยากเสนอแนะเพิ่มเติม', 250, 230);
        devCtx.fillText('สามารถทักมาพูดคุย เลี้ยงกาแฟ หรือร่วมสนับสนุนโปรเจกต์ได้เลย', 250, 260);
        devCtx.fillText('ครับ ยินดีรับฟังทุกความคิดเห็น!', 250, 290);

        // กล่องสีขาวพื้นหลังช่องทางการติดต่อ
        devCtx.fillStyle = '#ffffff';
        // ใช้ roundRect เพื่อสร้างกล่องขอบมน
        if (devCtx.roundRect) {
            devCtx.beginPath();
            devCtx.roundRect(50, 360, 400, 240, 15);
            devCtx.fill();
            devCtx.strokeStyle = '#ffd700';
            devCtx.lineWidth = 4;
            devCtx.stroke();
        } else {
            devCtx.fillRect(50, 360, 400, 240);
        }

        // ข้อความ LINE ID
        devCtx.fillStyle = '#666666';
        devCtx.font = 'bold 24px Sarabun, sans-serif';
        devCtx.fillText('LINE ID / เบอร์โทร:', 250, 410);

        devCtx.fillStyle = '#4CAF50';
        devCtx.font = 'bold 36px Sarabun, sans-serif';
        devCtx.fillText('0926533228', 250, 460);

        // วาดปุ่มทักไลน์สีเขียว
        devCtx.fillStyle = '#5ac346';
        if (devCtx.roundRect) {
            devCtx.beginPath();
            devCtx.roundRect(100, 500, 300, 60, 30);
            devCtx.fill();
        } else {
            devCtx.fillRect(100, 500, 300, 60);
        }

        devCtx.fillStyle = '#ffffff';
        devCtx.font = 'bold 22px Sarabun, sans-serif';
        devCtx.fillText('💬 ทักไลน์มาคุยกัน', 250, 538);

        const devTexture = new THREE.CanvasTexture(devCanvas);
        devTexture.colorSpace = THREE.SRGBColorSpace;
        const devPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(2.5, 3.25),
            new THREE.MeshBasicMaterial({ map: devTexture })
        );
        devPlane.position.set(0, 0, 0.06);
        devGroup.add(devPlane);

        // --- สร้างโซนคลิก (Hitbox) ล่องหน วางทับตำแหน่งปุ่ม LINE สีเขียว ---
        const lineBtnGeo = new THREE.PlaneGeometry(1.5, 0.3); // ขนาดกว้างยาวเท่าปุ่มที่วาด
        const lineBtnMat = new THREE.MeshBasicMaterial({
            color: 0x00ff00,
            transparent: true,
            opacity: 0 // ตั้งค่าเป็น 0 เพื่อให้ล่องหน แต่วัตถุยังใช้รับคำสั่งคลิกได้
        });
        const lineHitbox = new THREE.Mesh(lineBtnGeo, lineBtnMat);
        // คำนวณแกน Y ลงมาที่ -1.025 จะวางทับปุ่มสีเขียวพอดีเป๊ะ
        lineHitbox.position.set(0, -1.025, 0.07);
        lineHitbox.userData = { isLineButton: true };
        devGroup.add(lineHitbox);

        // จุดยืนอ่านบอร์ดขวา
        const devHotspot = new THREE.Mesh(hotspotGeo, hotspotMat.clone());
        devHotspot.position.set(5.0, 0.025, 0.0);
        devHotspot.userData = {
            isHotspot: true, type: "DEV",
            targetPos: new THREE.Vector3(5.0, 1.5, 0.0),
            lookAtPos: new THREE.Vector3(7.5, 1.675, 0.0)
        };
        scene.add(devHotspot);

        // =========================================================
        // สร้างเบาะรองนั่งสมาธิและบอท
        // =========================================================
        const cushionGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 32);
        const rows = 5, colsPerSide = 3, spacingX = 1.2, spacingZ = 1.1, aisleWidth = 1.0;
        const seatingGroup = new THREE.Group();
        seatingGroup.position.set(0, 0.05, -1.5);
        scene.add(seatingGroup);

        const cushionsList = [];
        let mySelectedCushion = null;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < (colsPerSide * 2); c++) {
                let xPos = (c < colsPerSide) ? (c - colsPerSide) * spacingX - (aisleWidth / 2) : (c - colsPerSide - 1) * spacingX + spacingX + (aisleWidth / 2);
                let zPos = r * spacingZ;
                const cushion = new THREE.Mesh(cushionGeometry, new THREE.MeshStandardMaterial({ color: 0x3b2219 }));
                cushion.position.set(xPos, 0, zPos);
                cushion.userData = { row: r + 1, col: c + 1, isOccupied: false, isMine: false, occupantName: "", isHotspot: false };
                seatingGroup.add(cushion);
                cushionsList.push(cushion);
            }
        }

        // --- ฟังก์ชันสร้างหุ่นคนนั่งสมาธิแบบทรงทึบมีออร่า (ปรับลดระดับแขนไม่ให้ทะลุไหล่) ---
        function createMeditatorAvatar() {
            const group = new THREE.Group();

            const auraMaterial = new THREE.MeshStandardMaterial({
                color: 0xffeab3,
                emissive: 0xd4af37,
                emissiveIntensity: 0.6,
                roughness: 0.4,
                metalness: 0.1
            });

            // 1. ศีรษะ
            const headGeo = new THREE.SphereGeometry(0.12, 16, 16);
            const head = new THREE.Mesh(headGeo, auraMaterial);
            head.position.set(0, 0.60, 0);
            group.add(head);

            // 2. ช่วงบ่าและไหล่
            const shoulderGeo = new THREE.SphereGeometry(0.15, 16, 16);
            const shoulder = new THREE.Mesh(shoulderGeo, auraMaterial);
            shoulder.scale.set(1.35, 0.65, 1.0);
            shoulder.position.set(0, 0.44, 0);
            group.add(shoulder);

            // 3. ลำตัว
            const bodyGeo = new THREE.CylinderGeometry(0.14, 0.26, 0.25, 16);
            const body = new THREE.Mesh(bodyGeo, auraMaterial);
            body.position.set(0, 0.32, 0);
            group.add(body);

            // 4. ช่วงหน้าท้อง/เชิงกราน
            const pelvisGeo = new THREE.SphereGeometry(0.28, 16, 16);
            const pelvis = new THREE.Mesh(pelvisGeo, auraMaterial);
            pelvis.scale.set(1.1, 0.6, 0.9);
            pelvis.position.set(0, 0.16, 0.02);
            group.add(pelvis);

            // 5. ท่อนล่าง / ท่านั่งขัดสมาธิ
            const legsGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.08, 16);
            const legs = new THREE.Mesh(legsGeo, auraMaterial);
            legs.scale.set(1.1, 1, 0.8);
            legs.position.set(0, 0.04, 0.05);
            group.add(legs);

            // 6. แขนซ้าย (กดแกน Y ลงจาก 0.35 เป็น 0.28 เพื่อซ่อนปลายแขนไว้ในบ่า)
            const armGeo = new THREE.CapsuleGeometry(0.045, 0.26, 4, 8);
            const leftArm = new THREE.Mesh(armGeo, auraMaterial);
            leftArm.position.set(-0.17, 0.28, 0.10);
            leftArm.rotation.set(-0.5, 0, 0.2);
            group.add(leftArm);

            // 7. แขนขวา (กดแกน Y ลงจาก 0.35 เป็น 0.28 เช่นเดียวกัน)
            const rightArm = new THREE.Mesh(armGeo, auraMaterial);
            rightArm.position.set(0.17, 0.28, 0.10);
            rightArm.rotation.set(-0.5, 0, -0.2);
            group.add(rightArm);

            // ปรับทิศทางให้หันหน้าไปทางทีวี
            group.rotation.y = Math.PI;

            return group;
        }

        const botCount = 4;
        const availableIndices = [...Array(cushionsList.length).keys()];
        for (let i = 0; i < botCount; i++) {
            if (availableIndices.length === 0) break;
            const cushionIdx = availableIndices.splice(Math.floor(Math.random() * availableIndices.length), 1)[0];
            const botCushion = cushionsList[cushionIdx];
            botCushion.userData.isOccupied = true;
            botCushion.userData.occupantName = `กัลยาณมิตร${Math.floor(Math.random() * 900 + 100)} (AI)`;

            // ทำให้เบาะที่ถูกจองเข้มขึ้นเล็กน้อย
            botCushion.material.color.setHex(0x2a1610);

            // เรียกใช้ฟังก์ชันสร้างหุ่นและวางตำแหน่งให้ตรงกับเบาะนั้น
            const avatar = createMeditatorAvatar();
            avatar.position.set(botCushion.position.x, 0.05, botCushion.position.z);
            seatingGroup.add(avatar);
        }
        document.getElementById('online-users').innerText = `ผู้เข้าร่วมขณะนี้: ${botCount + 1} คน`;

        // รวมวัตถุที่คลิกได้ทั้งหมด (เบาะนั่ง + จุดยืนอ่าน)
        const interactables = [...cushionsList, prHotspot, devHotspot, lineHitbox];

        // --- ระบบกล้องสมูท ---
        let isSeated = false;
        let isReading = false;
        let isTransitioning = false;
        const targetCamPos = new THREE.Vector3();
        const targetLookAt = new THREE.Vector3();

        const controls = new OrbitControls(camera, renderer.domElement);
        // ปิด enableDamping เพื่อให้กล้องหยุดทันทีที่ปล่อยเมาส์หรือนิ้ว แก้ปัญหาตาลาย
        controls.enableDamping = false;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;
        controls.target.copy(defaultTargetPos);

        // เพิ่มบรรทัดนี้เพื่อให้กล้องหมุนหันตามทิศทางเมาส์ที่ลาก
        controls.rotateSpeed = -1.0;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.target.tagName !== 'CANVAS') return;

            // บล็อกการคลิกเฉพาะตอนที่กล้องกำลังเคลื่อนที่ (วาร์ป) เท่านั้น
            if (isTransitioning) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            const intersects = raycaster.intersectObjects(interactables);

            if (intersects.length > 0) {
                const clickedObj = intersects[0].object;

                // ==========================================
                // 1. หากคลิกที่ปุ่มแอดไลน์ (ให้สิทธิพิเศษกดได้เสมอแม้ยืนอ่านบอร์ดอยู่)
                // ==========================================
                if (clickedObj.userData.isLineButton) {
                    window.open('https://line.me/ti/p/~0926533228', '_blank');

                    if (renderer.xr.isPresenting) {
                        renderer.xr.getSession().end();
                    }
                    return;
                }

                // *** ย้ายเงื่อนไขดักจับมาไว้ตรงนี้ ***
                // ถ้ากำลังนั่งสมาธิ หรือ กำลังยืนอ่านอยู่ จะไม่ให้กดเปลี่ยนไปที่เบาะอื่นหรือจุดอื่นซ้ำ
                if (isSeated || isReading) return;

                // ==========================================
                // 2. หากคลิกที่จุดยืนอ่าน (Hotspot จุดสีทอง)
                // ==========================================
                else if (clickedObj.userData.isHotspot) {
                    targetCamPos.copy(clickedObj.userData.targetPos);
                    targetLookAt.copy(clickedObj.userData.lookAtPos);

                    isReading = true;
                    isTransitioning = true;
                    controls.enabled = false;

                    const boardType = clickedObj.userData.type === "PR" ? "กระดานสะพานบุญ" : "บอร์ดสนับสนุนผู้พัฒนา";
                    document.getElementById('seat-status').innerText = `สถานะ: ยืนอ่าน (${boardType})`;

                    const standBtn = document.getElementById('stand-btn');
                    standBtn.innerText = "🚶 เดินกลับ";
                    standBtn.style.display = 'block';
                }

                // ==========================================
                // 3. หากคลิกที่เบาะนั่งสมาธิ
                // ==========================================
                else {
                    if (clickedObj.userData.isOccupied) {
                        alert(`ที่นั่งนี้มีผู้ใช้งานแล้ว (${clickedObj.userData.occupantName}) กรุณาเลือกที่นั่งอื่นครับ`);
                        return;
                    }

                    clickedObj.userData.isOccupied = true;
                    clickedObj.userData.isMine = true;
                    clickedObj.userData.occupantName = currentUserName;
                    clickedObj.material.color.setHex(0x00ffcc);
                    mySelectedCushion = clickedObj;

                    document.getElementById('seat-status').innerText = `สถานะ: นั่งสมาธิ ณ แถว ${clickedObj.userData.row}, ตัวที่ ${clickedObj.userData.col}`;

                    const standBtn = document.getElementById('stand-btn');
                    standBtn.innerText = "🚶 ลุกจากที่นั่ง";
                    standBtn.style.display = 'block';

                    const cushionWorldPos = new THREE.Vector3();
                    clickedObj.getWorldPosition(cushionWorldPos);

                    targetCamPos.set(cushionWorldPos.x, 1.0, cushionWorldPos.z);

                    const tvPos = new THREE.Vector3(1.5, 2.9, -4.8);
                    const dir = tvPos.clone().sub(targetCamPos).normalize();
                    targetLookAt.copy(targetCamPos).add(dir.multiplyScalar(0.01));

                    isSeated = true;
                    isTransitioning = true;
                    controls.enabled = false;
                }
            }
        });

        document.getElementById('stand-btn').addEventListener('click', () => {
            if (mySelectedCushion) {
                mySelectedCushion.userData.isMine = false;
                mySelectedCushion.userData.isOccupied = false;
                mySelectedCushion.userData.occupantName = "";
                mySelectedCushion.material.color.setHex(0x3b2219);
                mySelectedCushion = null;
            }

            document.getElementById('seat-status').innerText = "สถานะ: อิสระ (คลิกเลือกจุดต่างๆ ในห้อง)";
            document.getElementById('stand-btn').style.display = 'none';

            isSeated = false;
            isReading = false;
            isTransitioning = true;
            controls.enabled = false;

            targetCamPos.copy(defaultCameraPos);
            targetLookAt.copy(defaultTargetPos);
        });

        function animate() {
            if (isTransitioning) {
                // ปรับจาก 0.05 เป็น 0.15 ยิ่งค่าเข้าใกล้ 1 จะยิ่งพุ่งไวขึ้น (ถ้าเป็น 1 คือวาร์ปทันที)
                camera.position.lerp(targetCamPos, 0.15);
                controls.target.lerp(targetLookAt, 0.15);

                if (camera.position.distanceTo(targetCamPos) < 0.05) {
                    isTransitioning = false;
                    camera.position.copy(targetCamPos);
                    controls.target.copy(targetLookAt);
                    controls.enabled = true;

                    if (isSeated || isReading) {
                        controls.enableZoom = false;
                        controls.enablePan = false;
                        controls.rotateSpeed = -0.7;

                        controls.minPolarAngle = Math.PI / 2 - 0.4;
                        controls.maxPolarAngle = Math.PI / 2 + 0.3;

                        const angle = Math.atan2(targetCamPos.x - targetLookAt.x, targetCamPos.z - targetLookAt.z);
                        const range = (110 * Math.PI) / 180;
                        controls.minAzimuthAngle = angle - range;
                        controls.maxAzimuthAngle = angle + range;
                    } else {
                        controls.enableZoom = true;
                        controls.enablePan = true;
                        controls.rotateSpeed = -1.0;
                        controls.minPolarAngle = 0;
                        controls.maxPolarAngle = Math.PI / 2 + 0.1;
                        controls.minAzimuthAngle = -Infinity;
                        controls.maxAzimuthAngle = Infinity;
                    }
                }
            } else if (controls.enabled) {
                controls.update();
            }

            renderer.render(scene, camera);
            cssRenderer.render(scene, camera);
        }
        renderer.setAnimationLoop(animate);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        const fsButton = document.getElementById('fullscreen-btn');
        fsButton.addEventListener('click', () => {
            if (!document.fullscreenElement) { document.body.requestFullscreen(); fsButton.innerText = "ย่อหน้าจอ"; }
            else { document.exitFullscreen(); fsButton.innerText = "ขยายเต็มจอ"; }
        });
    </script>
</body>

</html>
